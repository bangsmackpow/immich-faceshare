services:
  faceshare:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - faceshare-data:/data
    env_file:
      - .env
    secrets:
      - immich_api_key
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    user: "1000:1000"

volumes:
  faceshare-data:

secrets:
  immich_api_key:
    file: ./secrets/immich_api_key.txt

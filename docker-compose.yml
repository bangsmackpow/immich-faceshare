services:
  faceshare:
    image: ghcr.io/bangsmackpow/immich-faceshare:latest
    pull_policy: always
    ports:
      - "3001:3001"
    volumes:
      - faceshare-data:/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    secrets:
      - immich_api_key
    networks:
      - default
      - immich_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  faceshare-data:

secrets:
  immich_api_key:
    file: ./secrets/immich_api_key.txt

networks:
  default:
    driver: bridge
  # Must match the network name of your Immich deployment.
  # Run `docker network ls` to find it (usually <project>_default).
  # If your Immich compose uses a different project name, change this.
  immich_default:
    external: true
